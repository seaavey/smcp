name: Rust CI & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check-and-test:
    name: Fast CI (Check & Test)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Rust Cache (Swatinem)
      uses: Swatinem/rust-cache@v2

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libssl-dev pkg-config

    - name: Cargo Check
      run: cargo check

    - name: Cargo Test
      run: cargo test

  release-binary:
    name: Release Multi-Platform Binaries
    needs: check-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Rust Cache (Swatinem)
      uses: Swatinem/rust-cache@v2

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libssl-dev pkg-config

    - name: Build release binary
      run: cargo build --release

    - name: Create tarball
      run: |
        cd target/release
        tar -czvf smcp-linux-x86_64.tar.gz smcp
        mv smcp-linux-x86_64.tar.gz ../../

    - name: Upload GitHub Release Asset
      uses: softprops/action-gh-release@v2
      with:
        files: smcp-linux-x86_64.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
