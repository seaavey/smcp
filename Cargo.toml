[package]
name = "smcp"
version = "0.2.0"
edition = "2021"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
rmcp = { version = "0.1", features = ["server", "transport-io", "macros"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "smtp-transport", "builder"] }
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pki-types = "1.15"
mailparse = "0.15"
webpki-roots = "0.26"
futures = "0.3"
imap = { version = "2.4.1", features = ["native-tls"] }
native-tls = "0.2.18"
